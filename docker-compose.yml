services:
  # ===========================================================================
  # 默认服务：SQLite 模式（开发/单机部署）
  # 使用方式: docker compose up -d
  # ===========================================================================
  app:
    build: .
    image: x-watcher:latest
    container_name: x-watcher
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - app-data:/app/data
    env_file:
      - path: .env.docker
        required: false
    environment:
      DATABASE_URL: sqlite:////app/data/news_agent.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # 注：PostgreSQL（prod profile）已于 2026-06-24 下线
  # 项目改用 file 数据层（XWATCHER_DATA_LAYER=file）：pg 表已 DROP、数据迁至 data_migrated/。
  # 原 postgres + app-prod 服务（及 postgres-data volume）已移除。
  # 详见 docs/drift-log.md 2026-06-24 条。
  # 如需容器化部署，用上方默认 app 服务（SQLite 模式）：docker compose up -d
  # ===========================================================================

volumes:
  app-data:
