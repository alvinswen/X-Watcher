[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-watcher"
version = "0.1.0"
description = "面向 Agent 的 X 平台智能信息监控服务"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Development Team"}
]
keywords = ["x", "twitter", "watcher", "monitor", "ai", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]

dependencies = [
    # Web 框架
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.5",

    # 数据验证
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # 数据库
    "sqlalchemy>=2.0.23",
    "alembic>=1.13.0",
    "aiosqlite>=0.19.0",  # SQLite 异步驱动

    # HTTP 客户端
    "httpx>=0.25.0",

    # 环境配置
    "python-dotenv>=1.0.0",

    # Result 类型
    "returns>=0.23.0",

    # 监控
    "prometheus-client>=0.19.0",

    # 认证
    "bcrypt>=5.0.0",
    "PyJWT>=2.11.0",

    # CLI
    "click>=8.0.0",

    # MCP (Model Context Protocol)
    "mcp[cli]>=1.2.0",

    # 数据分析
    "scipy>=1.11.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    # 测试
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",  # 用于测试 FastAPI

    # 代码质量
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "mypy-baseline>=0.7.4",

]

[project.urls]
Homepage = "https://github.com/your-org/x-watcher"
Repository = "https://github.com/your-org/x-watcher"

[project.scripts]
x-watcher = "src.cli.main:cli"

# Black 配置
[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # 默认排除
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # 自定义排除
  | \.kiro
  | \.claude
)/
'''

# Ruff 配置
[tool.ruff]
line-length = 100
target-version = "py311"

select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]

ignore = [
    "E501",  # 行长度由 Black 处理
    "B008",  # 函数调用中的默认参数（FastAPI 依赖）
    "B904",  # raise from (可能太严格）
    "ARG001",  # 未使用的参数（FastAPI 路由参数）
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]  # 允许未使用的导入
"tests/**/*.py" = ["ARG", "S101"]  # 测试中的未使用参数和 assert

[tool.ruff.isort]
known-first-party = ["src"]

# Pytest 配置
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]

# Coverage 配置
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Mypy 配置
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.mypy-baseline]
baseline_path = ".mypy-baseline.txt"

# Setuptools 包发现配置
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[[tool.mypy.overrides]]
module = [
    "returns.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# benchmark 工具代码非生产逻辑不纳入 strict
module = [
    "src.data_layer.bench.*",
]
ignore_errors = true
