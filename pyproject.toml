[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "x-watcher"
version = "1.51.2"
description = "面向 Agent 的 X 平台智能信息监控服务"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Development Team"}
]
keywords = ["x", "twitter", "watcher", "monitor", "ai", "fastapi"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
]

dependencies = [
    # Web 框架
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.5",

    # 数据验证
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",

    # HTTP 客户端
    "httpx>=0.25.0",

    # 环境配置
    "python-dotenv>=1.0.0",

    # Result 类型
    "returns>=0.23.0",

    # 监控
    "prometheus-client>=0.19.0",

    # 认证
    "bcrypt>=5.0.0",
    "PyJWT>=2.11.0",

    # CLI
    "click>=8.0.0",

    # MCP (Model Context Protocol)
    "mcp[cli]>=1.2.0",

]

[project.optional-dependencies]
dev = [
    # 测试
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",  # 用于测试 FastAPI

    # 代码质量
    "black>=23.11.0",
    "ruff==0.15.21",  # 门禁版本钉死·唯一事实源·升级路径见 scripts/check-lint.sh 尾注
    "mypy>=1.7.0",

]

[project.urls]
Homepage = "https://github.com/your-org/x-watcher"
Repository = "https://github.com/your-org/x-watcher"

[project.scripts]
x-watcher = "src.cli.main:cli"

# Black 配置
[tool.black]
line-length = 100
target-version = ["py311", "py312"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # 默认排除
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  # 自定义排除
  | \.kiro
  | \.claude
)/
'''

# Ruff 配置
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG", # flake8-unused-arguments
    "SIM", # flake8-simplify
]

ignore = [
    "E501",  # 行长度由 Black 处理
    "B008",  # 函数调用中的默认参数（FastAPI 依赖）
    "B904",  # raise from (可能太严格）
    "ARG001",  # 未使用的参数（FastAPI 路由参数）
    "UP042",  # 字符串枚举旧写法保留：5 个域模型枚举值随推文落盘（黑名单③）·StrEnum 化行为审计另立议题（CHG-038 Q1=A）
    "UP046",  # PEP695 泛型类改写涉黑名单③ Pydantic 域模型（pagination.py Page/Feed）·与 UP042 同批行为审计另立议题（CHG-038 留册）
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # 允许未使用的导入
"tests/**/*.py" = ["ARG", "S101"]  # 测试中的未使用参数和 assert
"src/main.py" = ["E402"]  # 启动时序 import 刻意设计（18 处·dotenv/中间件/路由注册次序敏感）·结构改造不在本包（CHG-038 Q2=A）
"tests/conftest.py" = ["E402"]  # 测试根 conftest 启动时序（2 处）·同上

[tool.ruff.lint.isort]
known-first-party = ["src"]

# Pytest 配置
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
]
filterwarnings = [
    "error",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

# Coverage 配置
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
fail_under = 85
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Mypy 配置
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

# Setuptools 包发现配置
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[[tool.mypy.overrides]]
module = [
    "returns.*",
]
ignore_missing_imports = true
